services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: liveko
      POSTGRES_PASSWORD: liveko123
      POSTGRES_DB: liveko_crm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liveko -d liveko_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
